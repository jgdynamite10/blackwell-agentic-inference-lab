[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwell-lab"
version = "0.1.0"
description = "Tooling for the Blackwell Agentic Inference Lab (schemas, results-privacy guards, preflight checks)"
readme = "README.md"
requires-python = ">=3.10"
# No license/license-files metadata and no LICENSE file: ownership and
# licensing are under review, and no license is currently granted (see
# README "License and disclaimer").
dependencies = [
    # format-nongpl provides rfc3339-validator etc. so JSON Schema format
    # checking rejects invalid date/date-time strings.
    "jsonschema[format-nongpl]>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S603", # subprocess without shell=True is what we want for preflight scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
