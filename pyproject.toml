[build-system]
# setuptools >= 77.0.3 is required for PEP 639 metadata (SPDX `license`
# expression string plus `license-files`).
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwell-lab"
version = "0.1.0"
description = "Tooling for the Blackwell Agentic Inference Lab (schemas, results-privacy guards, preflight checks)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # format-nongpl provides rfc3339-validator etc. so JSON Schema format
    # checking rejects invalid date/date-time strings.
    "jsonschema[format-nongpl]>=4.21",
]

[project.scripts]
blackwell-bench = "blackwell_lab.workload.runner:main"

[project.urls]
Homepage = "https://github.com/jgdynamite10/blackwell-agentic-inference-lab"
Repository = "https://github.com/jgdynamite10/blackwell-agentic-inference-lab"
Issues = "https://github.com/jgdynamite10/blackwell-agentic-inference-lab/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S603", # subprocess without shell=True is what we want for preflight scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
