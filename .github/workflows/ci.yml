name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party Actions are pinned to reviewed immutable commit SHAs
# (comment records the tag each SHA was resolved from):
#   actions/checkout     08eba0b27e820071cde6df949e0beb9ba4906955 = v4.3.0
#   actions/setup-python a26af69be951a213d495a4c3e4e4022e16d87065 = v5.6.0
# Secret detection uses the open-source Gitleaks CLI pinned to an exact
# release with a verified SHA-256 checksum (no gitleaks-action, no
# GITLEAKS_LICENSE, no artifact upload of findings).
# Terraform validation installs the exact pinned Terraform CLI release
# directly from releases.hashicorp.com with a verified SHA-256 checksum (no
# third-party setup action), and NEVER contacts Akamai APIs: init runs with
# -backend=false and no provider credentials exist in CI.

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff (pinned via constraints)
        run: pip install ruff -c constraints.txt
      - name: Ruff lint
        run: ruff check .

  format:
    name: Ruff format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff (pinned via constraints)
        run: pip install ruff -c constraints.txt
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras (pinned via constraints)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run full test suite
        run: pytest

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with dev extras (pinned via constraints)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Validate schemas and synthetic examples
        run: pytest tests/test_schemas.py -v

  privacy-guard:
    name: LAB_RESULTS_DIR privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with dev extras (pinned via constraints)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Test results-privacy path guard
        run: pytest tests/test_paths.py -v

  terraform-validation:
    name: Terraform validation (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: "1.9.8"
      TERRAFORM_SHA256: "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download and verify Terraform CLI (pinned release + checksum)
        run: |
          set -euo pipefail
          curl -sSL -o terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum --check --strict
          unzip -o terraform.zip terraform
          rm terraform.zip
          sudo install -m 0755 terraform /usr/local/bin/terraform
          terraform version
      - name: terraform fmt -check -recursive
        working-directory: infra/akamai
        run: terraform fmt -check -recursive
      - name: terraform init -backend=false (no credentials, no Akamai API)
        working-directory: infra/akamai
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: infra/akamai
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform validate -no-color
      - name: Install package with dev extras (pinned via constraints)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Lifecycle unit tests (terraform required, skips forbidden)
        env:
          BWLAB_REQUIRE_TERRAFORM: "1"
        run: pytest tests/test_cloud_lifecycle.py tests/test_terraform.py -v

  secret-detection:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks CLI (pinned release + checksum)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan full git history (redacted output, no findings artifact)
        run: |
          set -euo pipefail
          # --redact so detected values are never printed to the log; no
          # report file is written, so no artifact can contain secrets.
          ./gitleaks git --redact --no-banner --exit-code 1 .
